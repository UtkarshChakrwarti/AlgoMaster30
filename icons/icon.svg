<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C1C1E"/>
      <stop offset="50%" stop-color="#0A0A0C"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#007AFF" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#5E5CE6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#34C759" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34C759"/>
      <stop offset="100%" stop-color="#007AFF"/>
    </linearGradient>
    <filter id="appleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Apple Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="112" ry="112" fill="url(#bgGrad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="2"/>
  
  <!-- Subtle Internal Glow -->
  <rect x="24" y="24" width="464" height="464" rx="104" ry="104" fill="url(#glowGrad)"/>

  <!-- Algorithmic Nodes & Dynamic Pointers (Apple Style) -->
  <g filter="url(#appleGlow)">
    <!-- Branch Lines -->
    <path d="M160 350 L256 160 L352 350" stroke="rgba(255, 255, 255, 0.25)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M192 286 L320 286" stroke="rgba(255, 255, 255, 0.35)" stroke-width="10" stroke-linecap="round"/>
    <circle cx="256" cy="160" r="28" fill="#5E5CE6" stroke="#FFFFFF" stroke-width="6"/>
    <circle cx="160" cy="350" r="28" fill="#007AFF" stroke="#FFFFFF" stroke-width="6"/>
    <circle cx="352" cy="350" r="28" fill="#34C759" stroke="#FFFFFF" stroke-width="6"/>

    <!-- Subtle Center Core -->
    <circle cx="256" cy="286" r="14" fill="#30D158"/>
  </g>

  <!-- Specular Top Rim Reflection -->
  <path d="M 128 18 Q 256 22 384 18" stroke="rgba(255, 255, 255, 0.25)" stroke-width="2" stroke-linecap="round"/>
</svg>
